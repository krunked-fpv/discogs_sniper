<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Discogs Sniper">
  <defs>
    <!-- Deep obsidian vinyl disc base -->
    <radialGradient id="vinylBase" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d222c" />
      <stop offset="62%" stop-color="#11151d" />
      <stop offset="92%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#1a1f29" />
    </radialGradient>

    <!-- Metallic vinyl specular sheen -->
    <linearGradient id="vinylSheen" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="32%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="68%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18" />
    </linearGradient>

    <!-- Signature Discogs Sniper amber-gold label -->
    <radialGradient id="amberLabel" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>

    <!-- Crimson laser lock-on dot -->
    <radialGradient id="laserDot" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ff6b8b" />
      <stop offset="65%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </radialGradient>

    <!-- Clip specular sheen inside vinyl disc -->
    <clipPath id="discClip">
      <circle cx="32" cy="32" r="27" />
    </clipPath>
  </defs>

  <!-- Main 180g obsidian vinyl body -->
  <circle cx="32" cy="32" r="27.5" fill="url(#vinylBase)" />

  <!-- Diagonal studio light sheen wedges -->
  <g clip-path="url(#discClip)">
    <path d="M32 32 L10 4 L26 2 Z" fill="url(#vinylSheen)" />
    <path d="M32 32 L54 60 L38 62 Z" fill="url(#vinylSheen)" />
    <path d="M32 32 L4 18 L12 8 Z" fill="#ffffff" fill-opacity="0.07" />
    <path d="M32 32 L60 46 L52 56 Z" fill="#ffffff" fill-opacity="0.07" />
  </g>

  <!-- Concentric vinyl grooves -->
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="#2c3444" stroke-width="1" />
  <circle cx="32" cy="32" r="19.5" fill="none" stroke="#252c3a" stroke-width="1" />
  <circle cx="32" cy="32" r="15.5" fill="none" stroke="#2e3748" stroke-width="1" />

  <!-- Glowing amber-gold outer tactical bezel -->
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#f59e0b" stroke-width="2.5" />

  <!-- Subtle diagonal radar lock brackets -->
  <g fill="none" stroke="#10b981" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <path d="M16.5 21.5 A19 19 0 0 1 21.5 16.5" />
    <path d="M42.5 16.5 A19 19 0 0 1 47.5 21.5" />
    <path d="M47.5 42.5 A19 19 0 0 1 42.5 47.5" />
    <path d="M21.5 47.5 A19 19 0 0 1 16.5 42.5" />
  </g>

  <!-- Sniper crosshair reticles (N / S / E / W) -->
  <g stroke="#fbbf24" stroke-linecap="round">
    <!-- Bold outer ticks -->
    <line x1="32" y1="1.5" x2="32" y2="11.5" stroke-width="3" />
    <line x1="32" y1="52.5" x2="32" y2="62.5" stroke-width="3" />
    <line x1="1.5" y1="32" x2="11.5" y2="32" stroke-width="3" />
    <line x1="52.5" y1="32" x2="62.5" y2="32" stroke-width="3" />
    <!-- Precision inner hairlines -->
    <line x1="32" y1="11.5" x2="32" y2="19.5" stroke-width="1.4" opacity="0.9" />
    <line x1="32" y1="44.5" x2="32" y2="52.5" stroke-width="1.4" opacity="0.9" />
    <line x1="11.5" y1="32" x2="19.5" y2="32" stroke-width="1.4" opacity="0.9" />
    <line x1="44.5" y1="32" x2="52.5" y2="32" stroke-width="1.4" opacity="0.9" />
  </g>

  <!-- Center amber-gold vinyl label -->
  <circle cx="32" cy="32" r="11.5" fill="url(#amberLabel)" stroke="#0b0e14" stroke-width="1.8" />
  <circle cx="32" cy="32" r="8.2" fill="none" stroke="#0b0e14" stroke-width="0.9" stroke-opacity="0.45" />

  <!-- Spindle & crimson sniper laser lock-on bullseye -->
  <circle cx="32" cy="32" r="4.6" fill="#0b0e14" />
  <circle cx="32" cy="32" r="2.3" fill="url(#laserDot)" />
</svg>
