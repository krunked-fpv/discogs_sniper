<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Discogs Sniper v2.1-beta">
  <defs>
    <radialGradient id="vinylBase" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#192136" />
      <stop offset="62%" stop-color="#0b0f1b" />
      <stop offset="92%" stop-color="#05070e" />
      <stop offset="100%" stop-color="#11192b" />
    </radialGradient>

    <linearGradient id="neonBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="52%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ff1f8f" />
    </linearGradient>

    <radialGradient id="magentaCore" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#ff78c4" />
      <stop offset="45%" stop-color="#ff1f8f" />
      <stop offset="100%" stop-color="#9d174d" />
    </radialGradient>

    <linearGradient id="vinylSheen" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.24" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ff1f8f" stop-opacity="0.22" />
    </linearGradient>

    <clipPath id="discClip">
      <circle cx="32" cy="32" r="27" />
    </clipPath>
  </defs>

  <!-- Obsidian 180g vinyl body -->
  <circle cx="32" cy="32" r="27.5" fill="url(#vinylBase)" />

  <!-- Diagonal optical sheen wedges -->
  <g clip-path="url(#discClip)">
    <path d="M32 32 L10 4 L26 2 Z" fill="url(#vinylSheen)" />
    <path d="M32 32 L54 60 L38 62 Z" fill="url(#vinylSheen)" />
  </g>

  <!-- Concentric grooves -->
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="#22304c" stroke-width="1" />
  <circle cx="32" cy="32" r="19.5" fill="none" stroke="#1b263d" stroke-width="1" />
  <circle cx="32" cy="32" r="15.5" fill="none" stroke="#263554" stroke-width="1" />

  <!-- Neon cyan-to-magenta outer bezel -->
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="url(#neonBezel)" stroke-width="2.6" />

  <!-- Acid lime radar lock brackets -->
  <g fill="none" stroke="#39ff88" stroke-width="1.8" stroke-linecap="round" opacity="0.92">
    <path d="M16.5 21.5 A19 19 0 0 1 21.5 16.5" />
    <path d="M42.5 16.5 A19 19 0 0 1 47.5 21.5" />
    <path d="M47.5 42.5 A19 19 0 0 1 42.5 47.5" />
    <path d="M21.5 47.5 A19 19 0 0 1 16.5 42.5" />
  </g>

  <!-- Electric cyan crosshair reticles -->
  <g stroke="#00f0ff" stroke-linecap="round">
    <line x1="32" y1="1.5" x2="32" y2="11.5" stroke-width="3" />
    <line x1="32" y1="52.5" x2="32" y2="62.5" stroke-width="3" />
    <line x1="1.5" y1="32" x2="11.5" y2="32" stroke-width="3" />
    <line x1="52.5" y1="32" x2="62.5" y2="32" stroke-width="3" />
    <line x1="32" y1="11.5" x2="32" y2="19.5" stroke-width="1.4" opacity="0.9" />
    <line x1="32" y1="44.5" x2="32" y2="52.5" stroke-width="1.4" opacity="0.9" />
    <line x1="11.5" y1="32" x2="19.5" y2="32" stroke-width="1.4" opacity="0.9" />
    <line x1="44.5" y1="32" x2="52.5" y2="32" stroke-width="1.4" opacity="0.9" />
  </g>

  <!-- Laser magenta vinyl center label -->
  <circle cx="32" cy="32" r="11.2" fill="url(#magentaCore)" stroke="#05070e" stroke-width="1.8" />
  <circle cx="32" cy="32" r="4.6" fill="#05070e" />
  <circle cx="32" cy="32" r="2.2" fill="#00f0ff" />
</svg>
