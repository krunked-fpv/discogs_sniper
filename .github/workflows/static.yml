name: Build Discogs Sniper v2.1-beta Command Center & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Sniper v2.1-beta State & Static Command Center (index.html)
        env:
          DISCOGS_USERNAME: "krunked"
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: |
          python scripts/build_dashboard.py --sync-wantlist
          python scripts/build_dashboard.py --check

      - name: Run Sniper v2.1-beta Unit & Forensic Integrity Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
