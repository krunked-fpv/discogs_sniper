name: Build Discogs Sniper v3.0 Command Center & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # scripts/build_dashboard.py & unit tests use Python stdlib only — never install Playwright/Chromium in CI.
      - name: Compile Sniper State & Stage Static Web Artifact (_site)
        env:
          DISCOGS_USERNAME: "krunked"
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${DISCOGS_TOKEN:-}" ]; then
            echo "DISCOGS_TOKEN secret present; attempting live wantlist sync + static build..."
            if ! python scripts/build_dashboard.py --sync-wantlist --stage-dir _site; then
              echo "::warning::Live wantlist sync failed; falling back to offline static build."
              python scripts/build_dashboard.py --stage-dir _site
            fi
          else
            echo "DISCOGS_TOKEN secret not configured; running offline static build..."
            python scripts/build_dashboard.py --stage-dir _site
          fi
          python scripts/build_dashboard.py --check

      - name: Verify staged static artifact (_site)
        run: |
          set -euo pipefail
          test -s _site/index.html || { echo "::error::_site/index.html is missing or empty!"; exit 1; }
          test -f _site/.nojekyll || { echo "::error::_site/.nojekyll is missing!"; exit 1; }
          for asset in manifest.webmanifest sw.js favicon.svg favicon.ico favicon-32x32.png apple-touch-icon.png data/sniper_state.json; do
            test -s "_site/$asset" || { echo "::error::Expected public static asset missing or empty: _site/$asset"; exit 1; }
          done
          for forbidden in .env .env.local discogs_sniper.py sniper.log sniper.lock seed_snapshot.json sniper_config.json chrome_discogs_profile; do
            if [ -e "_site/$forbidden" ]; then
              echo "::error::Private/backend file leaked into _site/: $forbidden"
              exit 1
            fi
          done
          echo "[ok] Verified _site/index.html ($(wc -c < _site/index.html) bytes) and clean public PWA asset staging."

      - name: Run Sniper Unit & Forensic Integrity Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
